[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flasgger>=0.9.7.1",
    "gcsfs>=2026.3.0",
    "google-cloud-aiplatform>=1.143.0",
    "google-cloud-bigquery>=3.40.1",
    "google-cloud-storage>=3.10.1",
    "ipykernel>=6.30.0",
    "kfp>=2.16.0",
    "matplotlib>=3.10.3",
    "mlflow>=3.1.4",
    "pandas>=2.3.1",
    "pandas-gbq>=0.31.1",
    "polars>=1.39.3",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "xgboost>=3.0.2",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.9",
]

[tool.ruff.lint]
# Añade "I" a las reglas seleccionadas por defecto
extend-select = ["I"]
