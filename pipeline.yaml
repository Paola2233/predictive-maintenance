# PIPELINE DEFINITION
# Name: predictive-maintenance-xgboost-v3
# Description: Predictive maintenance: feature engineering → XGBoost (TimeSeriesSplit) → Vertex AI Experiment → Model Registry → conditional Endpoint deploy
# Inputs:
#    bq_dataset: str [Default: 'preprocessed_data']
#    bq_table: str [Default: 'features_engineered_v2']
#    bucket_name: str
#    colsample_bytree: float [Default: 0.8]
#    endpoint_display_name: str [Default: 'predictive-maintenance-endpoint']
#    f2_score_threshold: float [Default: 0.4]
#    learning_rate: float [Default: 0.05]
#    machine_type: str [Default: 'n1-standard-4']
#    max_depth: int [Default: 6.0]
#    model_name: str [Default: 'XGBoostPredictiveMaintenance']
#    n_cv_splits: int [Default: 5.0]
#    n_estimators: int [Default: 300.0]
#    pr_auc_threshold: float [Default: 0.5]
#    project_id: str
#    recall_pos_threshold: float [Default: 0.6]
#    region: str [Default: 'us-central1']
#    roc_auc_threshold: float [Default: 0.75]
#    subsample: float [Default: 0.8]
#    target_window_size: int [Default: 7.0]
#    vertex_experiment: str [Default: 'pdm-xgboost-experiment']
components:
  comp-evaluate-component:
    executorLabel: exec-evaluate-component
    inputDefinitions:
      artifacts:
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        f2_score_threshold:
          parameterType: NUMBER_DOUBLE
        pr_auc_threshold:
          parameterType: NUMBER_DOUBLE
        project_id:
          parameterType: STRING
        recall_pos_threshold:
          parameterType: NUMBER_DOUBLE
        region:
          parameterType: STRING
        roc_auc_threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        approved_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        eval_clf_metrics:
          artifactType:
            schemaTitle: system.ClassificationMetrics
            schemaVersion: 0.0.1
        eval_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        approved:
          parameterType: BOOLEAN
  comp-preprocess-component:
    executorLabel: exec-preprocess-component
    inputDefinitions:
      parameters:
        bq_dataset:
          parameterType: STRING
        bq_table:
          parameterType: STRING
        bucket_name:
          parameterType: STRING
        project_id:
          parameterType: STRING
        target_window_size:
          parameterType: NUMBER_INTEGER
  comp-train-component:
    executorLabel: exec-train-component
    inputDefinitions:
      parameters:
        bq_dataset:
          parameterType: STRING
        bq_table:
          parameterType: STRING
        bucket_name:
          parameterType: STRING
        colsample_bytree:
          parameterType: NUMBER_DOUBLE
        learning_rate:
          parameterType: NUMBER_DOUBLE
        max_depth:
          parameterType: NUMBER_INTEGER
        model_name:
          parameterType: STRING
        n_cv_splits:
          parameterType: NUMBER_INTEGER
        n_estimators:
          parameterType: NUMBER_INTEGER
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
        subsample:
          parameterType: NUMBER_DOUBLE
        vertex_experiment:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_clf_metrics:
          artifactType:
            schemaTitle: system.ClassificationMetrics
            schemaVersion: 0.0.1
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        artifact_uri:
          parameterType: STRING
        f2_score:
          parameterType: NUMBER_DOUBLE
        pr_auc:
          parameterType: NUMBER_DOUBLE
        recall_neg:
          parameterType: NUMBER_DOUBLE
        recall_pos:
          parameterType: NUMBER_DOUBLE
        roc_auc:
          parameterType: NUMBER_DOUBLE
deploymentSpec:
  executors:
    exec-evaluate-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform>=1.40'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_component(\n    input_model: Input[Model],\n    project_id:\
          \ str,\n    region: str,\n    roc_auc_threshold: float,\n    pr_auc_threshold:\
          \ float,\n    f2_score_threshold: float,\n    recall_pos_threshold: float,\n\
          \    approved_model: Output[Model],\n    eval_metrics: Output[Metrics],\n\
          \    eval_clf_metrics: Output[ClassificationMetrics],\n) -> NamedTuple(\"\
          EvalOutputs\", [(\"approved\", bool)]):\n    \"\"\"\n    Multi-metric quality\
          \ gate.\n\n    Gate logic\n    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\n    The model is APPROVED only when ALL four thresholds\
          \ are met:\n      \u2022 ROC-AUC  \u2265 roc_auc_threshold    (overall discrimination)\n\
          \      \u2022 PR-AUC   \u2265 pr_auc_threshold     (precision-recall trade-off\
          \ on minority class)\n      \u2022 F2       \u2265 f2_score_threshold  \
          \ (recall-weighted F-score; penalises missed failures)\n      \u2022 Recall(+)\u2265\
          \ recall_pos_threshold (minimum detection rate for actual failures)\n\n\
          \    Why multi-metric?\n    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    A model can\
          \ pass a single ROC-AUC gate while having unacceptably low\n    recall on\
          \ the positive (failure) class \u2014 exactly the scenario we must\n   \
          \ avoid in predictive maintenance. Gating on F2 and recall_pos directly\n\
          \    closes that loophole.\n\n    KFP UI artefacts produced\n    \u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   \
          \ eval_metrics     \u2192 per-metric cards + pass/fail margin.\n    eval_clf_metrics\
          \ \u2192 confusion matrix forwarded from train summary.\n    \"\"\"\n  \
          \  import json\n    import logging\n    from collections import namedtuple\n\
          \n    logging.basicConfig(level=logging.INFO)\n    logger = logging.getLogger(\"\
          evaluate\")\n\n    with open(input_model.path) as fh:\n        summary =\
          \ json.load(fh)\n\n    roc_auc    = float(summary.get(\"roc_auc\",    0))\n\
          \    pr_auc     = float(summary.get(\"pr_auc\",     0))\n    f2_score  \
          \ = float(summary.get(\"f2_score\",   0))\n    recall_pos = float(summary.get(\"\
          recall_pos\", 0))\n    recall_neg = float(summary.get(\"recall_neg\", 0))\n\
          \    resource_name = summary.get(\"resource_name\", \"\")\n    cv_summary\
          \    = summary.get(\"cv_summary\", {})\n\n    # \u2500\u2500 Gate decisions\
          \ (all must pass) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\n    checks = {\n        \"roc_auc\":    (roc_auc,    roc_auc_threshold),\n\
          \        \"pr_auc\":     (pr_auc,     pr_auc_threshold),\n        \"f2_score\"\
          :   (f2_score,   f2_score_threshold),\n        \"recall_pos\": (recall_pos,\
          \ recall_pos_threshold),\n    }\n\n    approved = all(value >= threshold\
          \ for value, threshold in checks.values())\n\n    for metric, (value, threshold)\
          \ in checks.items():\n        passed = value >= threshold\n        margin\
          \ = value - threshold\n        logger.info(\n            f\"  {metric}:\
          \ {value:.4f} {'\u2265' if passed else '<'} \"\n            f\"{threshold:.4f}\
          \ (margin={margin:+.4f}) \u2192 {'PASS \u2713' if passed else 'FAIL \u2717\
          '}\"\n        )\n\n    logger.info(\n        f\"Gate result: {'APPROVED\
          \ \u2713' if approved else 'REJECTED \u2717'}\"\n    )\n\n    # \u2500\u2500\
          \ Output[Metrics] \u2014 evaluation gate cards in Pipelines UI \u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    eval_metrics.log_metric(\"\
          roc_auc\",              roc_auc)\n    eval_metrics.log_metric(\"roc_auc_threshold\"\
          ,    roc_auc_threshold)\n    eval_metrics.log_metric(\"roc_auc_margin\"\
          ,       round(roc_auc    - roc_auc_threshold,    4))\n\n    eval_metrics.log_metric(\"\
          pr_auc\",               pr_auc)\n    eval_metrics.log_metric(\"pr_auc_threshold\"\
          ,     pr_auc_threshold)\n    eval_metrics.log_metric(\"pr_auc_margin\",\
          \        round(pr_auc     - pr_auc_threshold,     4))\n\n    eval_metrics.log_metric(\"\
          f2_score\",             f2_score)\n    eval_metrics.log_metric(\"f2_score_threshold\"\
          ,   f2_score_threshold)\n    eval_metrics.log_metric(\"f2_score_margin\"\
          ,      round(f2_score   - f2_score_threshold,   4))\n\n    eval_metrics.log_metric(\"\
          recall_pos\",           recall_pos)\n    eval_metrics.log_metric(\"recall_pos_threshold\"\
          , recall_pos_threshold)\n    eval_metrics.log_metric(\"recall_pos_margin\"\
          ,    round(recall_pos - recall_pos_threshold, 4))\n\n    eval_metrics.log_metric(\"\
          recall_neg\",           recall_neg)\n    eval_metrics.log_metric(\"approved\"\
          ,             float(approved))\n\n    # \u2500\u2500 Output[ClassificationMetrics]\
          \ \u2014 visual panel in Pipelines UI \u2500\u2500\u2500\u2500\u2500\n \
          \   n_folds = int(cv_summary.get(\"cv_roc_auc_mean\", 0) and\n         \
          \         sum(1 for k in cv_summary if k.startswith(\"fold_\") and k.endswith(\"\
          _tp\")))\n    # Fall back: reconstruct from aggregated confusion matrix\
          \ if available\n    agg_tn = int(cv_summary.get(\"fold_1_tn\", 0))  # just\
          \ fold 1 if summary missing\n    agg_fp = int(cv_summary.get(\"fold_1_fp\"\
          , 0))\n    agg_fn = int(cv_summary.get(\"fold_1_fn\", 0))\n    agg_tp =\
          \ int(cv_summary.get(\"fold_1_tp\", 0))\n    # Sum all folds for the aggregate\
          \ view\n    folds_found = [k.split(\"_\")[1] for k in cv_summary if k.startswith(\"\
          fold_\") and k.endswith(\"_tp\")]\n    if folds_found:\n        agg_tn =\
          \ int(sum(cv_summary.get(f\"fold_{f}_tn\", 0) for f in folds_found))\n \
          \       agg_fp = int(sum(cv_summary.get(f\"fold_{f}_fp\", 0) for f in folds_found))\n\
          \        agg_fn = int(sum(cv_summary.get(f\"fold_{f}_fn\", 0) for f in folds_found))\n\
          \        agg_tp = int(sum(cv_summary.get(f\"fold_{f}_tp\", 0) for f in folds_found))\n\
          \n    eval_clf_metrics.log_confusion_matrix(\n        categories=[\"No Failure\
          \ (0)\", \"Will Fail (1)\"],\n        matrix=[[agg_tn, agg_fp], [agg_fn,\
          \ agg_tp]],\n    )\n\n    fpr = 1.0 - recall_neg\n    eval_clf_metrics.log_roc_curve(\n\
          \        fpr=[0.0, round(fpr, 4), 1.0],\n        tpr=[0.0, round(recall_pos,\
          \ 4), 1.0],\n        threshold=[1.0, 0.5, 0.0],\n    )\n\n    # \u2500\u2500\
          \ Forward model to deploy component \u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\n    approved_model.metadata[\"resource_name\"] = resource_name\
          \ if approved else \"\"\n    approved_model.metadata[\"roc_auc\"]      \
          \ = roc_auc\n    approved_model.metadata[\"pr_auc\"]        = pr_auc\n \
          \   approved_model.metadata[\"f2_score\"]      = f2_score\n    approved_model.metadata[\"\
          recall_pos\"]    = recall_pos\n    approved_model.metadata[\"approved\"\
          ]      = approved\n\n    with open(approved_model.path, \"w\") as fh:\n\
          \        json.dump({**summary, \"approved\": approved}, fh, indent=2)\n\n\
          \    EvalOutputs = namedtuple(\"EvalOutputs\", [\"approved\"])\n    return\
          \ EvalOutputs(approved=approved)\n\n"
        image: us-central1-docker.pkg.dev/abiding-kingdom-491823-b0/predictive-maintenance-repo/predictive-maintenance:v1
    exec-preprocess-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'polars>=0.20'\
          \ 'google-cloud-bigquery>=3.0' 'db-dtypes' 'pyarrow' 'google-cloud-storage'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_component(\n    project_id: str,\n    bucket_name:\
          \ str,\n    target_window_size: int,\n    bq_dataset: str,\n    bq_table:\
          \ str,\n):\n    \"\"\"\n    Runs DataPreprocessor:\n      \u2022 Loads raw\
          \ tables from BigQuery (raw_data dataset)\n      \u2022 Engineers rolling-window\
          \ telemetry features + lag counts + target label\n      \u2022 Saves the\
          \ result to BigQuery (preprocessed_data dataset)\n\n    No local file or\
          \ KFP artifact is produced \u2014 BigQuery is the handoff\n    between this\
          \ component and the train component.\n    \"\"\"\n    import os\n    import\
          \ logging\n\n    logging.basicConfig(level=logging.INFO)\n    logger = logging.getLogger(\"\
          preprocess\")\n\n    os.environ[\"GCP_PROJECT_ID\"] = project_id\n    os.environ[\"\
          GCS_BUCKET_NAME\"] = bucket_name\n\n    from src.model.preprocessing import\
          \ DataPreprocessor\n\n    preprocessor = DataPreprocessor(target_window_size=target_window_size)\n\
          \    df = preprocessor.create_features(save_df=True)\n\n    logger.info(\n\
          \        f\"Preprocessing complete: {df.shape[0]:,} rows \xD7 {df.shape[1]}\
          \ cols \"\n        f\"\u2192 BigQuery {project_id}.{bq_dataset}.{bq_table}\"\
          \n    )\n\n"
        image: us-central1-docker.pkg.dev/abiding-kingdom-491823-b0/predictive-maintenance-repo/predictive-maintenance:v1
    exec-train-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'xgboost>=2.0'\
          \ 'scikit-learn>=1.3' 'pandas>=2.0' 'numpy' 'google-cloud-bigquery>=3.0'\
          \ 'db-dtypes' 'google-cloud-storage' 'google-cloud-aiplatform>=1.40'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_component(\n    project_id: str,\n    region: str,\n  \
          \  bucket_name: str,\n    model_name: str,\n    vertex_experiment: str,\n\
          \    bq_dataset: str,\n    bq_table: str,\n    n_estimators: int,\n    max_depth:\
          \ int,\n    learning_rate: float,\n    subsample: float,\n    colsample_bytree:\
          \ float,\n    n_cv_splits: int,\n    output_model: Output[Model],\n    output_metrics:\
          \ Output[Metrics],\n    output_clf_metrics: Output[ClassificationMetrics],\n\
          ) -> NamedTuple(\n    \"TrainOutputs\",\n    [\n        (\"roc_auc\", float),\n\
          \        (\"pr_auc\", float),\n        (\"f2_score\", float),\n        (\"\
          recall_pos\", float),\n        (\"recall_neg\", float),\n        (\"artifact_uri\"\
          , str),\n    ],\n):\n    \"\"\"\n    Trains XGBoost with TimeSeriesSplit\
          \ CV.\n\n    KFP UI artefacts produced\n    \u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    output_metrics   \
          \    \u2192 scalar cards in the Vertex AI Pipelines run view.\n        \
          \                   Includes mean \xB1 std for every CV metric.\n    output_clf_metrics\
          \   \u2192 Confusion matrix + ROC curve panels rendered\n              \
          \             natively in the Pipelines UI (no external tool).\n    output_model\
          \ (JSON)  \u2192 handoff payload for evaluate_component.\n    \"\"\"\n \
          \   import os\n    import json\n    import numpy as np\n    from collections\
          \ import namedtuple\n\n    os.environ[\"GCP_PROJECT_ID\"]   = project_id\n\
          \    os.environ[\"GCP_REGION\"]       = region\n    os.environ[\"GCS_BUCKET_NAME\"\
          ]  = bucket_name\n    os.environ[\"MODEL_NAME\"]       = model_name\n  \
          \  os.environ[\"VERTEX_EXPERIMENT\"]= vertex_experiment\n    os.environ[\"\
          BQ_DATASET\"]       = bq_dataset\n    os.environ[\"BQ_TABLE\"]         =\
          \ bq_table\n\n    from src.model.xg_boost_trainer import XGBoostTrainer\n\
          \n    trainer = XGBoostTrainer(\n        n_estimators     = n_estimators,\n\
          \        max_depth        = max_depth,\n        learning_rate    = learning_rate,\n\
          \        subsample        = subsample,\n        colsample_bytree = colsample_bytree,\n\
          \        n_cv_splits      = n_cv_splits,\n        bq_dataset       = bq_dataset,\n\
          \        bq_table         = bq_table,\n    )\n\n    # result keys: vertex_model,\
          \ resource_name, artifact_uri, cv_summary, cv_metrics\n    result      =\
          \ trainer.tune()\n    resource_name = result[\"resource_name\"]\n    artifact_uri\
          \  = result[\"artifact_uri\"]\n    cv_summary    = result[\"cv_summary\"\
          ]   # full flat dict (mean + std + per-fold)\n    cv_metrics    = result[\"\
          cv_metrics\"]   # back-compat aliases (plain mean values)\n\n    # \u2500\
          \u2500 Extract headline metrics \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    roc_auc\
          \    = float(cv_metrics.get(\"cv_roc_auc\",  0.0))\n    pr_auc     = float(cv_metrics.get(\"\
          cv_pr_auc\",   0.0))\n    f2_score   = float(cv_metrics.get(\"cv_f2_score\"\
          , 0.0))\n    f1_macro   = float(cv_metrics.get(\"cv_f1_macro\", 0.0))\n\
          \    recall_pos = float(cv_metrics.get(\"cv_recall_1\", 0.0))\n    recall_neg\
          \ = float(cv_metrics.get(\"cv_recall_0\", 0.0))\n    precision_pos = float(cv_summary.get(\"\
          cv_precision_1_mean\", 0.0))\n\n    roc_auc_std  = float(cv_summary.get(\"\
          cv_roc_auc_std\",  0.0))\n    pr_auc_std   = float(cv_summary.get(\"cv_pr_auc_std\"\
          ,   0.0))\n    f2_std       = float(cv_summary.get(\"cv_f2_score_std\",\
          \ 0.0))\n    f1_std       = float(cv_summary.get(\"cv_f1_macro_std\", 0.0))\n\
          \    recall_pos_std = float(cv_summary.get(\"cv_recall_1_std\", 0.0))\n\
          \    recall_neg_std = float(cv_summary.get(\"cv_recall_0_std\", 0.0))\n\n\
          \    # \u2500\u2500 Output[Metrics] \u2014 scalar cards in Pipelines UI\
          \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    # Aggregate means\n    output_metrics.log_metric(\"\
          cv_roc_auc_mean\",      roc_auc)\n    output_metrics.log_metric(\"cv_pr_auc_mean\"\
          ,        pr_auc)\n    output_metrics.log_metric(\"cv_f2_score_mean\",  \
          \    f2_score)\n    output_metrics.log_metric(\"cv_f1_macro_mean\",    \
          \  f1_macro)\n    output_metrics.log_metric(\"cv_recall_pos_mean\",    recall_pos)\n\
          \    output_metrics.log_metric(\"cv_recall_neg_mean\",    recall_neg)\n\
          \    output_metrics.log_metric(\"cv_precision_pos_mean\", precision_pos)\n\
          \n    # Std deviations \u2014 a high std on recall_pos flags instability\n\
          \    output_metrics.log_metric(\"cv_roc_auc_std\",      roc_auc_std)\n \
          \   output_metrics.log_metric(\"cv_pr_auc_std\",        pr_auc_std)\n  \
          \  output_metrics.log_metric(\"cv_f2_score_std\",      f2_std)\n    output_metrics.log_metric(\"\
          cv_f1_macro_std\",      f1_std)\n    output_metrics.log_metric(\"cv_recall_pos_std\"\
          ,    recall_pos_std)\n    output_metrics.log_metric(\"cv_recall_neg_std\"\
          ,    recall_neg_std)\n\n    # Per-fold ROC-AUC (quick variance inspection\
          \ without opening the run)\n    for fold in range(1, n_cv_splits + 1):\n\
          \        fold_roc = float(cv_summary.get(f\"fold_{fold}_roc_auc\", 0.0))\n\
          \        fold_pr  = float(cv_summary.get(f\"fold_{fold}_pr_auc\",  0.0))\n\
          \        fold_f2  = float(cv_summary.get(f\"fold_{fold}_f2_score\",0.0))\n\
          \        output_metrics.log_metric(f\"fold_{fold}_roc_auc\", fold_roc)\n\
          \        output_metrics.log_metric(f\"fold_{fold}_pr_auc\",  fold_pr)\n\
          \        output_metrics.log_metric(f\"fold_{fold}_f2_score\",fold_f2)\n\n\
          \    # \u2500\u2500 Output[ClassificationMetrics] \u2014 visual panels in\
          \ Pipelines UI \u2500\u2500\u2500\u2500\n    # Aggregate confusion matrix\
          \ from fold data\n    agg_tn = int(sum(cv_summary.get(f\"fold_{f}_tn\",\
          \ 0) for f in range(1, n_cv_splits + 1)))\n    agg_fp = int(sum(cv_summary.get(f\"\
          fold_{f}_fp\", 0) for f in range(1, n_cv_splits + 1)))\n    agg_fn = int(sum(cv_summary.get(f\"\
          fold_{f}_fn\", 0) for f in range(1, n_cv_splits + 1)))\n    agg_tp = int(sum(cv_summary.get(f\"\
          fold_{f}_tp\", 0) for f in range(1, n_cv_splits + 1)))\n\n    output_clf_metrics.log_confusion_matrix(\n\
          \        categories=[\"No Failure (0)\", \"Will Fail (1)\"],\n        matrix=[[agg_tn,\
          \ agg_fp], [agg_fn, agg_tp]],\n    )\n\n    # ROC curve \u2014 reconstruct\
          \ from aggregate TPR/FPR approximation.\n    # A production pipeline would\
          \ pass the full threshold sweep from the\n    # trainer; here we log the\
          \ mean operating point + convex hull endpoints\n    # which is sufficient\
          \ for the Pipelines UI panel.\n    tpr = recall_pos\n    fpr = 1.0 - recall_neg\n\
          \    output_clf_metrics.log_roc_curve(\n        fpr=[0.0, round(fpr, 4),\
          \ 1.0],\n        tpr=[0.0, round(tpr, 4), 1.0],\n        threshold=[1.0,\
          \ 0.5, 0.0],\n    )\n\n    # \u2500\u2500 JSON handoff for evaluate_component\
          \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
          \u2500\u2500\u2500\u2500\u2500\u2500\n    summary = {\n        \"resource_name\"\
          : resource_name,\n        \"artifact_uri\":  artifact_uri,\n        # headline\
          \ metrics (evaluate_component reads these)\n        \"roc_auc\":       roc_auc,\n\
          \        \"pr_auc\":        pr_auc,\n        \"f2_score\":      f2_score,\n\
          \        \"f1_macro\":      f1_macro,\n        \"recall_pos\":    recall_pos,\n\
          \        \"recall_neg\":    recall_neg,\n        # full summary for any\
          \ downstream component that wants it\n        \"cv_summary\":    cv_summary,\n\
          \    }\n    with open(output_model.path, \"w\") as fh:\n        json.dump(summary,\
          \ fh, indent=2)\n\n    output_model.metadata[\"resource_name\"] = resource_name\n\
          \    output_model.metadata[\"artifact_uri\"]  = artifact_uri\n    output_model.metadata[\"\
          cv_roc_auc\"]    = roc_auc\n    output_model.metadata[\"cv_pr_auc\"]   \
          \  = pr_auc\n    output_model.metadata[\"cv_f2_score\"]   = f2_score\n\n\
          \    TrainOutputs = namedtuple(\n        \"TrainOutputs\",\n        [\"\
          roc_auc\", \"pr_auc\", \"f2_score\", \"recall_pos\", \"recall_neg\", \"\
          artifact_uri\"],\n    )\n    return TrainOutputs(\n        roc_auc     \
          \ = roc_auc,\n        pr_auc       = pr_auc,\n        f2_score     = f2_score,\n\
          \        recall_pos   = recall_pos,\n        recall_neg   = recall_neg,\n\
          \        artifact_uri = artifact_uri,\n    )\n\n"
        image: us-central1-docker.pkg.dev/abiding-kingdom-491823-b0/predictive-maintenance-repo/predictive-maintenance:v1
        resources:
          cpuLimit: 4.0
          memoryLimit: 16.0
          resourceCpuLimit: '4'
          resourceMemoryLimit: 16G
